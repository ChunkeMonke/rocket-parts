# Shared design state for l1-cheap — the one "whiteboard" every agent reads.
# Each agent edits ONLY its own section. Values are TBD until sourced or decided.
# Units: mm, g, N, s, m/s, calibers.

owner:                     # set by the owner; agents never change these
  budget_usd: 100
  contingency_pct: 5
  stability_target_cal: 1.8
  stability_band_cal: 0.2  # owner wrote "+-2"; read as 0.2
  stability_band_applies: liftoff_only   # owner 2026-11-20; in-flight margin reported, not gated
  airframe_od_class_mm: 38
  motor_class: 29mm H

motor:                     # motor agent — see motor.md (2026-11-21)
  # 2026-11-21 OWNER CHANGE: AeroTech H100W-14A DMS (38 mm single-use), MINIMUM-DIAMETER in LOC BT-1.52
  # (ID 38.735 measured); thrust ring bears on the aft lip of a printed sleeve over the tube.
  # Old motor (superseded): H182R-14A DMS 29 mm, 207/115 g, 203 mm, 218 N-s, motor/H182R.eng.
  # Sources (all read via WebSearch 2026-11-21; direct fetches blocked):
  #   TC  = thrustcurve.org/motors/AeroTech/H100W_DMS (values "calculated", not cert document)
  #   WM  = wildmanrocketry.com/products/h100w   QA = questaerospace.com/products/product_f89c2d4d-4c3c-9a99-bfd8-b2d0b1dcef8a
  designation: AeroTech H100W-14A DMS (38 mm single-use), AT part 081014   # owner 2026-11-21
  diameter_class_mm: 38    # class (product name "38mm x 155mm"); NOT a measured case OD
  case_od_mm: TBD          # not published (forum threads asking, no answer). AT I500T DMS page lists "1.500 in (38mm)" nominal = 38.10 -> 0.64 mm diametral clearance in 38.735 ID IF true. MEASURE
  thrust_ring: {present: yes, od_mm: TBD, thickness_mm: TBD}   # "built-in", factory-glued (AT DMS data sheet); dims not published; MEASURE. See AT 2014 DMS thrust-ring advisory (motor.md)
  loaded_mass_g: 261       # TC, QA, WM agree
  propellant_mass_g: 121   # TC, QA
  burnout_mass_g: 140      # derived 261 - 121 (ignores delay/ejection mass lost)
  length_mm: 155           # AT/QA product name "38mm x 155mm" (QA 6.12 in); TC 153, RocketReviews 157.5 — RSE file governs the sim
  total_impulse_ns: 226.8  # TC (calculated) = WM; manufacturer listing (QA) 234; RocketReviews 223.9
  avg_thrust_n: 97.7       # WM labels 97.7 avg (= 226.8/2.32); QA 100; TC's unlabelled 116.1 unresolved
  max_thrust_n: 137.8      # structural design value: max of WM 137.75 (labelled max), QA 131, RocketReviews 130.2
  burn_time_s: 2.32        # WM (TC 2.3, QA 2.3, RocketReviews 2.40)
  delay_s: TBD             # 14 s max, owner drills shorter (UDDT per QA); set from stability's re-sim (coast to apogee)
  hazmat: yes              # QA "Requires HAZMAT shipping via UPS or FEDEX"
  price_usd: 54.99         # WM, QA, AT catalog 03.26.25 (searched 2026-11-21); eRockets $54.99 out of stock
  failures_mess: 3         # TC quotes 3 reported failures in MESS (motorcato.org); details not seen
  retention: PROPOSAL 3 x M3 screw + washer over thrust ring into heat-set inserts in sleeve fin-root bosses (rev 2 Option A carried over); sleeve geometry TBD
  retention_insert: M3 x 5.7 mm brass heat-set (CNC Kitchen standard via Prusa listing); hole 4.0 mm (accu-components chart)  # proposal
  retention_design_load_n: 366   # ESTIMATE: 15 psi x 1178.4 mm2 (38.735 tube-ID face, upper bound for case OD) = 122 N, x3 margin
  retention_washer: TBD          # OD/position set by thrust ring OD and insert radius (TBD); screw length TBD
  thrust_curve_source: projects/l1-cheap/motor/H100W.eng (from owner ThrustCurve CSV 2026-11-21, contributor Mike Haberer; curve Itot 228.4 N-s, peak 130.2 N, burn 2.40 s)

aero:                      # aerodynamics agent — see aero.md section 0 (2026-11-21, min-diameter H100W, fin_can_md)
  # 2026-11-21 FIN OPTIMISATION for 2.0 cal at liftoff, ZERO ballast (owner band 1.8 +/- 0.2, liftoff only).
  # OLD values (2026-11-20, 29 mm layout; rev 3 uses them): count 3, root 100, tip 40, span 40, sweep 60, t 5,
  #   cp 768.3 (old body), cd 0.70-0.83, Vmax 286-369, Mach 0.84-1.09, root bending 1.9 MPa.
  #   With the min-diameter mass table those fins give -0.70 cal (UNSTABLE) — aero.md 0.3.
  fin_count: 3
  fin_root_chord_mm: 50    # flutter: required G ~ (Cr/t)^3, so a short, thick root wins (aero.md 0.4)
  fin_tip_chord_mm: 30
  fin_span_mm: 77          # solved for 2.00 cal (Barrowman M0, ref d 41.275) with the ESTIMATED mass table, aero.md 0.2; 71 -> 1.80 cal
  fin_sweep_mm: 20         # = root - tip: TE straight and flush with the aft face (no overhang printing aft-face down)
  fin_thickness_mm: 6      # thickest of 3-6 mm = lowest required G; t 5 / 4 variants in aero.md 0.4 if the owner's G allows
  fin_edges: NACA 4-digit symmetric (fin_can_md), TE 0.84 mm (2 outer-wall lines)
  fin_body_od_mm: 46.795   # fins sit on the fin_can_md sleeve (interference factor with r = 23.40)
  sleeve_overlap_assumed_mm: 100   # ASSUMED unchanged from rev 3 (root chord 50 occupies the aft 50 mm); fin_can_md owns it
  cp_from_nose_tip_mm: 899.0   # Barrowman M0: nose 2.000 @ 76.9, step 0.184 @ 910.7, fairing cone 0.386 @ 920.8, fins 16.175 @ 1000.0. RocketPy 1.13: 899.1 (M0), 905.4 (M0.5), 917.4 (M0.8)
  cg_liftoff_from_nose_mm: 816.5   # ESTIMATE, aero.md 0.2 mass table (607.6 g, pack on the motor, 0 ballast); stability owns the real number
  margin_liftoff_cal: 2.00     # ref d 41.275 (tube). = 1.76 cal if OpenRocket references the 46.795 sleeve (aero.md 0.6). +/-1.5 cal swing from mass ESTIMATES
  cd_estimate: "0.73 @ M0.1, 0.89 @ M0.5, 1.13 @ M0.7"   # ESTIMATE: aero.md s.3 buildup with the old fins swapped for these; fin dCd 0.103/0.224/0.416 (OpenRocket tech-doc friction + rounded-LE method)
  max_velocity_m_s: 268        # owner OpenRocket (H100W, Pepto B. #2) nominal; MC P95 291, max 310 (owner CSV, 500 runs)
  max_mach: 0.79               # owner OR; MC P95 0.86
  fin_flutter_velocity_m_s: TBD  # needs PETG G (owner). REQUIRED G (TN 4197 / PoF 291, ISA sea level): 71 MPa @ 268 m/s, 83 @ 291, 159 @ 402 (1.5 x 268)
  fin_root_bending_mpa: 6.5      # alpha 5 deg, q 44.0 kPa (268 m/s, sea level), one fin normal; 14.7 at 402 m/s. Within layers (radial, XY)

nosecone:                  # nosecone agent — see projects/l1-cheap/nosecone.md (2026-11-20). PROPOSED, owner review pending
  shape: tangent ogive     # subsonic flight; sharp-enough tip prints tip-up without supports (tip half-angle 14.3 deg)
  length_mm: 165           # exposed length, tip to shoulder step; design choice, fineness 4.0 on nominal OD
  base_od_mm: 41.275       # tube OD NOMINAL; od_measured_mm is TBD, so re-set once measured
  fineness: 4.0            # 165 / 41.275
  shoulder_length_mm: 40   # design choice, about 1 caliber (rule of thumb, see nosecone.md)
  shoulder_od_mm: 38.555   # tube id_measured 38.735 - 2 x snug_slip 0.09 (skills/SKILL.md)
  wall_thickness_mm: 2.2   # cone and shoulder; 2 outer lines + 3 inner lines = 2.19 mm; fully solid (< 2 x 2.67 mm crust)
  aft_bulkhead_thickness_mm: 5  # integral, printed on the bed; Kevlar strap + ballast fill port, hole sizes TBD
  print_height_mm: 205     # tip up; 205 <= 256 Z limit, X/Y 41.3
  mass_g: 52.7             # ESTIMATE, walls + infill model at 25 % infill in the bulkhead core (51.7 at 0 %, 55.5 at 100 %)
  cg_from_tip_mm: 119.9    # ESTIMATE, same model, no ballast
  ballast_g: TBD           # stability agent to request; cavity volume and CG table in nosecone.md
  ballast_cavity_cm3_to_100mm: 27.2   # interior from tip to 100 mm aft of tip; uniform-fill CG 74.6 mm from tip

payload:                   # payload agent
  contents: none           # owner 2026-11-20: Quasar-LR NOT flown in this rocket (cheap L1 build)
  mass_g: 0
  bay_length_mm: 0

stability:                 # stability agent — see projects/l1-cheap/stability.md (2026-11-20)
  sim_tool: rocketpy 1.13.0
  sim_script: sims/l1_cheap.py   # .venv/bin/python sims/l1_cheap.py [--allow-tbd] [--set key=value ...]
  # ---- design choices owned by stability (PROPOSED, owner review pending) ----
  body_tube_length_mm: 863       # full LOC BT-1.52 stock. If payload adds a bay cut from this stock, the main tube = 863 - bay (sweep does this)
  fin_span_request_mm: null      # null = use aero.fin_span_mm (40, flutter-limited). 45/50 cut ballast to 65/43 g but worsen flutter; see stability.md
  ballast_g: 90.5                # nose cavity, NO altimeter, fin can rev 2 (bosses) + 3 insert sets -> 1.80 cal liftoff (re-solved 2026-11-20; was 89 for rev 1 + tape). Re-solve when payload reports (~30 g at 80 g / 180 mm bay, ~1 g at 120 g). Set from the WEIGHED nose (1 g nose ~ 0.9 g ballast); ~1 g ballast per 1 mm of CG
  ballast_cg_from_nose_mm: 74.6  # nosecone.md table: uniform fill tip to 100 mm (27.2 cm3 -> needs >= 3.27 g/cm3 packed; owner has ballast, material/density TBD)
  aim_liftoff_margin_cal: 1.8    # RECOMMENDED aim (stability.md s.4): min in-flight margin = liftoff margin; 1.5 saves only 12 g ballast / +4 m/s
  balance_check_cg_from_nose_mm: 771   # ready-to-fly (motor in, chute packed, ballast in) balance point to verify; +/- 8 mm = +/- 0.2 cal (owner band). Aft of 779 -> add ~1 g ballast per mm
  # ---- results: sims/l1_cheap.py --allow-tbd --set payload.mass_g=0 --set payload.bay_length_mm=0 --margin-plot out/sims/l1_cheap_margin_vs_time.png (2026-11-20) ----
  # PROVISIONAL: payload (Quasar-LR) mass/bay TBD; tube, liner, chute, epoxy, buttons, tape, nose are ESTIMATES (assumptions below)
  total_length_mm: 1128          # nose 165 + tube 863 + fin can exposed 100
  liftoff_mass_g: 710            # structure 503 + motor 207
  burnout_mass_g: 595            # + up to 10 g less if the delay/ejection loss is real (unpublished; sensitivity 0/5/10 g)
  cg_liftoff_from_nose_mm: 770.8
  cg_burnout_from_nose_mm: 721.4
  cp_from_nose_mm: 845.5         # Barrowman M~0 (aero.md formula, Lb 963); RocketPy 845.4 (M0), 856.6 from M 0.8 up (RocketPy caps its compressibility factor at M 0.8)
  margin_liftoff_cal: 1.81       # PASS vs 1.8 +/- 0.2 (owner: band gates LIFTOFF ONLY)
  margin_rail_exit_cal: 1.90     # 1.83 m rail, M 0.08 (RocketPy)
  margin_min_in_flight_cal: 1.81 # at liftoff: CP moves aft with Mach and CG moves forward with burn, so the margin only rises during boost
  margin_max_in_flight_cal: 3.28 # at burnout, M 0.83 (CP(M) + burnt-out CG)
  margin_burnout_cal: 3.01       # static (M 0) burnout margin, REPORTED not gated; 3.01-3.09 at apogee for 0-10 g delay/ejection loss
  apogee_m: 1285                 # 4214 ft AGL; Cd x0.85..x1.3 -> ~1413..1096 m; 4.5 m/s wind -> 1279 m
  time_to_apogee_s: 13.87
  burnout_time_s: 1.235
  coast_to_apogee_s: 12.64       # for the motor delay (Cd x0.85..x1.3 -> 13.48..11.36 s)
  max_velocity_m_s: 283.1        # at 1.20 s
  max_mach: 0.83                 # subsonic; 0.87-0.90 for the light span-45/50 options (657-680 g)
  max_q_kpa: 48.3
  rail_exit_velocity_m_s: {rail_1p5m: 25.6, rail_1p83m: 28.4}   # no rail-button geometry modelled (travel = rail length)
  recommended_delay_s: 12        # deploy 6.2 m/s at 1283 m AGL (Cd x1); <= 14.6 m/s over Cd x0.85-1.3. 13 s equally good if the AT tool offers it. Motor agent to confirm steps
  deploy_velocity_m_s: 6.2       # at 12 s delay, nominal Cd
  deploy_altitude_m: 1283
  target_mass_g: {nose_cone: 52.7, fin_can: 171.1}   # verify.py targets (+/-5 %). Fin can = parts/fin_can.py rev 1 model mass at 25 % infill
  # ---- printed-part model data (used by the sim INSTEAD of the fin_can estimate below when numeric) ----
  fin_can_model_mass_g: 171.8        # parts/fin_can.py rev 2 (Option A bosses), verify mass model at 25 % infill (171.0 at 0 %, 174.1 at 100 %); out/fin_can/rev2/, 2026-11-20
  fin_can_model_cg_from_aft_mm: 79.8 # rev 2, solid-mesh CG forward of the aft face (part ~99 % solid)
  # ---- assumptions: used ONLY where the owning section is TBD. Each has its basis. ----
  assumptions:
    tube_linear_density_g_per_mm: 0.1085   # ESTIMATE: wall area from shop OD/ID (159.6 mm2) x 0.68 g/cm3 OpenRocket "cardboard" density (rocketryforum.com/goto/post?id=2317962, 2026-11-20). No published LOC tube mass found. WEIGH THE TUBE.
    cardboard_density_g_cm3: 0.68          # OpenRocket "cardboard" (same basis as the tube); used for the MMT-1.14 liner
    liner_cg: motor_midpoint               # liner = motor length, coaxial with the motor
    fin_can:                     # FALLBACK ESTIMATE only, used if fin_can_model_mass_g is not a number (walls + infill model, skills/SKILL.md)
      exposed_length_mm: root_chord        # fins' root spans the exposed section, TE flush with aft face (aero.md)
      shoulder_length_mm: motor_minus_exposed  # bore supports the full motor length (motor.md: bore runs along the motor axis)
      bore_diameter_mm: motor_class        # motor.case_od_mm is TBD; 29 mm class used for mass only
      shoulder_od_mm: snug_slip            # shop id_measured - 2 x snug_slip, same as the nose shoulder
      infill_pct: 25                       # print profile default
    motor_aft_offset_mm: 0       # ASSUMPTION: motor aft end flush with fin can aft face (thrust ring thickness TBD)
    motor_dry_cg: midpoint       # ASSUMPTION: case + propellant CG at motor mid-length (no published CG)
    motor_nozzle_radius_mm: 7    # ASSUMPTION, unpublished; RocketPy needs it, no pressure correction used so it does not change thrust
    chute_mass_g: 57             # ESTIMATE from recovery (owner's 40 in chute, <=57 g: 42 in hex nylon 2.01 oz, the-rocketman.com/?p=3121); used while recovery.chute_mass_g is TBD. WEIGH IT.
    shock_cord_g_per_m: 2.91     # owner 2026-11-20: 9KM DWLIFE 750 lb, 88.7 g/100 ft (vendor table)
    shock_cord_length_factor: 3  # owner/recovery rule: 3 x rocket length
    shock_cord_loop_allowance_mm: 300  # ESTIMATE (recovery: allowance TBD); 0.3 m = 0.9 g, negligible
    wadding_g: 2                 # ESTIMATE: 8 sheets x 0.24 g; 0.24 g = 17 g shipping weight / 72 sheets (hobbyetc listing), an upper bound
    recovery_pack_length_mm: 120 # ESTIMATE: 57 g chute at a guessed 0.4 g/cm3 packed = 143 cm3 / 117.8 cm3 per 100 mm, + cord + wadding. Pack test pending (recovery)
    recovery_pack_position: on_motor  # pack rests on the motor forward end (gravity on the pad, inertia in boost) = most aft = conservative
    epoxy_g: 10                  # ESTIMATE: shoulder joint film + rail buttons + cord anchor; no measured value
    epoxy_cg: fin_can_shoulder
    rail_buttons_g: 5            # ESTIMATE: 2 x 2.5 g (Delrin button + screw); no published mass found; rail size TBD
    rail_button_cg_from_aft_mm: 300  # ESTIMATE: average of one button at the fin can and one near the CG
    retention_g: 5               # ESTIMATE: 3 x (M3 brass heat-set insert + M3 screw + M3 washer), not weighed; motor agent carried 4 g for 2 sets. Owner chose Option A inserts (fin_can rev 2). Placed at the aft face
    payload_cg_from_nose_mm: TBD # Quasar-LR altimeter slot: mass from payload.mass_g, position from payload (TBD)
    cd_vs_mach: [[0.0, 0.70], [0.1, 0.70], [0.5, 0.76], [0.7, 0.83], [1.2, 0.83]]  # aero.md table (M 0.1-0.7); held flat above 0.7 = no transonic rise (ASSUMPTION, biases Vmax and apogee high)
    launch_site: {latitude: 28.03, longitude: -80.59, elevation_m: 0}  # Palm Bay FL approx; standard atmosphere, no wind (same as aero.md)
    rail_lengths_m: [1.5, 1.83]  # club rail TBD; both reported
    launch_inclination_deg: 90   # vertical, no wind: sets apogee time for the delay
    wind_m_s: 0                  # constant wind (toward +east), standard atmosphere; 0 = calm. Sweeps use 4.5 (10 mph, a sample value, not a forecast)
    delay_ejection_loss_g: 0     # ASSUMPTION: mass lost by the delay grain + ejection charge is UNPUBLISHED; the 92 g burnout mass treats it as 0
    delay_ejection_loss_sensitivity_g: [0, 5, 10]  # sensitivity cases; modelled burning linearly over the delay at the motor forward end
    propellant_mass_model: rocketpy  # RocketPy impulse-proportional m(t) = RSE file m(t) within 0.05 g (RSE auto-calc-mass=1, same method)

recovery:                  # recovery agent — see projects/l1-cheap/recovery.md (2026-11-20)
  deployment: single deploy, motor ejection charge (H182R-14A)  # PROPOSED; owner to confirm; no electronics owned
  descent_rate_target_m_s: TBD   # owner to set; recovery.md tabulates 4.5 / 5.5 / 6.5 m/s
  descent_mass_range_g: [450, 700]  # PLACEHOLDER range given by main session; replace with stability's burnout mass
  chute_cd_assumed: 0.75     # flat sheet, Van Milligan / NASA GRC; 1.5 (Nakka) shown as optimistic bound
  chute: owned 40 in, brand/type TBD (owner 2026-11-20)  # 3.44-4.29 m/s at Cd 0.75 over 450-700 g; reefing proposed to cut drift
  chute_diameter_in: 40      # owner
  chute_mass_g: TBD          # ESTIMATE <=57 g (42" hex nylon 2.01 oz, the-rocketman.com/?p=3121); weigh it
  shock_cord: 9KM DWLIFE hollow-braid Kevlar, 750 lb (3336 N) rated, 2.3 mm dia, 16 strand, 2.91 g/m (88.7 g/100 ft); owner has 16 m  # owner 2026-11-20
  shock_cord_length_rule: 3x rocket length (forum/4-H rule of thumb; 3-5x range)  # cut length = 3 x stability.total_length_mm + loop allowance (TBD)
  shock_cord_min_rating_n: 2860  # ESTIMATE, 40 in chute: 953 N opening at 40 m/s (Cd .75, Cx 1.6) x proposed SF 3. Was 1030 (24 in). At <=20 m/s deploy: 714 N
  shock_cord_check: knotted (40% eff., aramid fig-8 study) 1334 N -> passes 24 in case and 40 in up to ~27 m/s deploy only (1334/3=445 N opening); spliced/sewn eyes recommended
  anchor_min_net_area_mm2: 191   # 953 N x SF 3 / 15 MPa interlayer; 48 mm2 if deploy <=20 m/s
  ejection_protection: Estes recovery wadding (PROPOSED, $5.43-5.99)  # Nomex 6x6 alt
  deploy_velocity_m_s: TBD   # needs stability sim + motor delay
  recovery_mass_g: TBD       # chute + cord + wadding; weigh
  recovery_cg_from_nose_mm: TBD  # depends on bay position (stability/payload)
  bay_length_mm: TBD         # pack test of chosen chute; tube free volume 117.8 cm3 per 100 mm

fin_can:                   # part library (main session) — parts/fin_can.py rev 1 DRAFT, 2026-11-20
  # One-piece PETG: fin can + motor mount + liner seat + centering + airframe shoulder.
  # PLACEHOLDER = not measured/confirmed; the part is NOT print-ready while any remain.
  body_od_mm: {value: 41.275, status: PLACEHOLDER, note: "tube OD nominal; measure the BT-1.52 with calipers"}
  shoulder_fit: {value: snug_slip, status: PROPOSED, note: "slip leaves an epoxy gap (owner recommended choice pending)"}
  exposed_length_mm: {value: 100, status: FROM_AERO, note: "= fin root chord, TE flush with aft face"}
  shoulder_length_mm: {value: 103, status: FROM_STABILITY, note: "motor 203 - exposed 100: bore supports full motor"}
  liner: {value: "LOC MMT-1.14 paper tube", status: OWNER, note: "owner 2026-11-20: plan for a paper liner"}
  liner_id_mm: {value: 28.956, status: CITED, note: "1.140 in, OpenRocket catalogue via github.com/nrdptel/fusionspace-eridanus/issues/280 (third-party)"}
  liner_od_mm: {value: 30.5, status: PLACEHOLDER, note: "not published; measure the liner"}
  liner_length_mm: {value: 203, status: FROM_MOTOR, note: "= motor length"}
  bore_fit: {value: snug_slip, status: PROPOSED, note: "shop snug-slip per side applied to the liner in the bore (borrowed tube rule; confirm)"}
  airfoil: {value: naca4_symmetric, status: PROPOSED}
  fin_thickness_mode: {value: constant, status: PROPOSED, note: "same max thickness root to tip (stiffer tip for flutter)"}
  fin_te_thickness: {value: two_outer_lines, status: PROPOSED, note: "2 x outer-wall line width, printable trailing edge on the bed"}
  root_fillet_r_mm: {value: 4, status: PROPOSED, note: "owner suggested range 3-5 not yet confirmed"}
  root_fillet_sections: {value: 6, status: PROPOSED, note: "loft stations approximating the circular fillet"}
  airfoil_points: {value: 41, status: PROPOSED, note: "cosine-spaced chord stations per side"}
  anchor: {value: epoxy_groove, status: PROPOSED, note: "printed loop does not fit a ~4 mm wall; Kevlar laid in a shoulder-OD groove and epoxied under the tube"}
  anchor_groove_width_mm: {value: 3.0, status: PROPOSED, note: "Kevlar 2.3 mm + clearance"}
  anchor_groove_depth_mm: {value: 2.6, status: PROPOSED}
  anchor_angle_deg: {value: 60, status: PROPOSED, note: "between fins"}
  retention: {value: insert_bosses_at_fin_roots, status: OWNER, note: "owner 2026-11-20 rev 2: Option A, one M3 heat-set insert per fin in a faired boss at the fin root, aft end (supersedes friction fit)"}
  insert_hole_d_mm: {value: 4.0, status: CITED, note: "M3 heat-set hole for 3D prints, accu-components chart (motor.md)"}
  insert_depth_mm: {value: 5.7, status: CITED, note: "M3 x 5.7 standard insert length, Prusa/CNC Kitchen listing (motor.md)"}
  boss_wall: {value: wall_band, status: PROPOSED, note: "plastic around the hole = the 6-loop perimeter band from the print profile (2.67 mm), so the boss prints as solid perimeters"}
  boss_fairing_length_mm: {value: 20, status: PROPOSED, note: "length over which the boss tapers into the fin, forward of the insert"}
  washer_min_overlap_mm: {value: 2.0, status: FROM_MOTOR, note: "motor.md overlap rule: washer OD/2 - (insert radius - ring OD/2) >= 2 mm"}
  thrust_ring_od_mm: {value: 33.0, status: PLACEHOLDER, note: "not published; measure the motor (mating check only)"}
  thrust_ring_thk_mm: {value: 3.0, status: PLACEHOLDER, note: "not published; measure the motor (mating check only)"}
  target_mass_g: {value: 171.1, status: FROM_STABILITY, note: "stability budget 2026-11-20 uses the rev 1 model mass (25 % infill)"}

fin_can_md:                # part library — parts/fin_can_md.py, MIN-DIAMETER sleeve for the 38 mm H100W (owner 2026-11-21)
  # Printed sleeve slides OVER the BT-1.52 aft end; the motor sits inside the tube; the aft lip is the thrust stop.
  tube_od_mm: {value: 41.275, status: PLACEHOLDER, note: "BT-1.52 OD nominal; MEASURE — sets the sleeve bore"}
  sleeve_fit: {value: snug_slip, status: PROPOSED, note: "shop snug-slip per side, leaves an epoxy gap (borrowed tube rule)"}
  sleeve_wall: {value: wall_band, status: PROPOSED, note: "= 6-loop perimeter band (2.67 mm), prints fully solid"}
  sleeve_overlap_mm: {value: 100, status: FROM_AERO, note: "length of sleeve on the tube = fin root chord (fins TE flush with aft face)"}
