# Shared design state for l1-cheap — the one "whiteboard" every agent reads.
# Each agent edits ONLY its own section. Values are TBD until sourced or decided.
# Units: mm, g, N, s, m/s, calibers.

owner:                     # set by the owner; agents never change these
  budget_usd: 100
  contingency_pct: 5
  stability_target_cal: 1.8
  stability_band_cal: 0.2  # owner wrote "+-2"; pending confirmation
  airframe_od_class_mm: 38
  motor_class: 29mm H

motor:                     # motor agent
  # WORKING ASSUMPTION (owner has not formally chosen).
  # Primary source: AeroTech DMS H182R-14A spec sheet, supplied by owner 2026-11-20.
  # Cross-check (search, 2026-11-20): https://www.thrustcurve.org/motors/AeroTech/HP-H182R
  designation: AeroTech H182R-14A (29 mm DMS single-use)  # working assumption; TRA certified
  diameter_class_mm: 29    # spec sheet "29 mm x 203 mm (1.13 x 8.00 in)"; class, not measured case OD
  case_od_mm: TBD          # not published; measure the motor
  thrust_ring: TBD         # not on spec sheet; presence, OD, thickness TBD; measure
  loaded_mass_g: 207       # spec sheet
  propellant_mass_g: 115   # spec sheet
  burnout_mass_g: 92       # derived 207 - 115 (ignores delay/ejection mass lost)
  length_mm: 203           # spec sheet
  total_impulse_ns: 218    # spec sheet (49.0 lb-s)
  avg_thrust_n: 175          # RSE file (label-derived 182)
  max_thrust_n: 205          # structural design value: max(plot read 205, RSE 200.8, label 192)
  burn_time_s: 1.235        # RSE file (label 1.2)
  delay_s: TBD             # 14 s max, adjustable shorter; set from stability sim
  retention: TBD           # proposal in motor.md (screws + washers over thrust ring)
  thrust_curve_source: projects/l1-cheap/motor/H182R.eng (from owner's ThrustCurve RSE, AT DMS data May 2014; curve Itot 216.1 N-s)

aero:                      # aerodynamics agent
  # Initial proposal 2026-11-20, see aero.md. Span is the tuning knob for the 1.8 cal margin (aero.md table 2).
  fin_count: 3
  fin_root_chord_mm: 100
  fin_tip_chord_mm: 40
  fin_span_mm: 40          # tuning knob: stability picks 30-50 mm from aero.md table once the CG is known
  fin_sweep_mm: 60         # LE sweep, root LE to tip LE; = root - tip, so the TE is square and flush with the aft end
  fin_thickness_mm: 5      # provisional; flutter check pending PETG shear modulus (TBD from owner)
  fin_edges: LE rounded, TE square
  cp_from_nose_tip_mm: 768.3   # Barrowman M~0; ASSUMES 165 mm tangent ogive + 863 mm body; formula in aero.md. RocketPy 1.13 agrees (768.2)
  cp_formula: "CP = 0.2279*k*Ln + 0.7721*(Ln + Lb - 55.7)  [mm; k=0.466 ogive, 0.5 Haack/VK, 0.666 cone; Lb = nose base to aft end]"
  cd_estimate: 0.70-0.83   # ESTIMATE, component buildup for M 0.1-0.7, 60 um roughness; no rail buttons, no nose wave drag
  max_velocity_m_s: 286-369  # RocketPy, H182R.eng, ASSUMED structure 300-500 g + 207 g motor; Mach 0.84-1.09
  max_mach: 0.84-1.09
  fin_flutter_velocity_m_s: TBD  # needs PETG shear modulus G (owner)
  fin_root_bending_mpa: 1.9      # t=5, alpha 5 deg at max q 81.8 kPa; within layers, compared to 15 MPa interlayer anyway

nosecone:                  # nosecone agent — see projects/l1-cheap/nosecone.md (2026-11-20). PROPOSED, owner review pending
  shape: tangent ogive     # subsonic flight; sharp-enough tip prints tip-up without supports (tip half-angle 14.3 deg)
  length_mm: 165           # exposed length, tip to shoulder step; design choice, fineness 4.0 on nominal OD
  base_od_mm: 41.275       # tube OD NOMINAL; od_measured_mm is TBD, so re-set once measured
  fineness: 4.0            # 165 / 41.275
  shoulder_length_mm: 40   # design choice, about 1 caliber (rule of thumb, see nosecone.md)
  shoulder_od_mm: 38.555   # tube id_measured 38.735 - 2 x snug_slip 0.09 (skills/SKILL.md)
  wall_thickness_mm: 2.2   # cone and shoulder; 2 outer lines + 3 inner lines = 2.19 mm; fully solid (< 2 x 2.67 mm crust)
  aft_bulkhead_thickness_mm: 5  # integral, printed on the bed; Kevlar strap + ballast fill port, hole sizes TBD
  print_height_mm: 205     # tip up; 205 <= 256 Z limit, X/Y 41.3
  mass_g: 52.7             # ESTIMATE, walls + infill model at 25 % infill in the bulkhead core (51.7 at 0 %, 55.5 at 100 %)
  cg_from_tip_mm: 119.9    # ESTIMATE, same model, no ballast
  ballast_g: TBD           # stability agent to request; cavity volume and CG table in nosecone.md
  ballast_cavity_cm3_to_100mm: 27.2   # interior from tip to 100 mm aft of tip; uniform-fill CG 74.6 mm from tip

payload:                   # payload agent
  contents: none (pending owner confirmation)  # optional add-ons listed in payload.md
  mass_g: 0                # no payload; if an add-on is chosen, see payload.md for its mass
  bay_length_mm: 0         # no separate bay; vent holes not needed with no altimeter

stability:                 # stability agent
  total_length_mm: TBD
  liftoff_mass_g: TBD
  cg_liftoff_from_nose_mm: TBD
  cg_burnout_from_nose_mm: TBD
  margin_liftoff_cal: TBD
  margin_burnout_cal: TBD
  sim_tool: rocketpy 1.13.0
  apogee_m: TBD
  time_to_apogee_s: TBD
  rail_exit_velocity_m_s: TBD

recovery:                  # recovery agent — see projects/l1-cheap/recovery.md (2026-11-20)
  deployment: single deploy, motor ejection charge (H182R-14A)  # PROPOSED; owner to confirm; no electronics owned
  descent_rate_target_m_s: TBD   # owner to set; recovery.md tabulates 4.5 / 5.5 / 6.5 m/s
  descent_mass_range_g: [450, 700]  # PLACEHOLDER range given by main session; replace with stability's burnout mass
  chute_cd_assumed: 0.75     # flat sheet, Van Milligan / NASA GRC; 1.5 (Nakka) shown as optimistic bound
  chute: TBD                 # 24" fits only if target >= ~6.5 m/s at 575 g; 30" covers 450-700 g at <= 5.7 m/s (Cd 0.75)
  chute_mass_g: TBD          # weigh the chute or get vendor figure
  shock_cord: TBD            # owner's Kevlar: form/length/rating TBD
  shock_cord_length_rule: 3x rocket length (forum/4-H rule of thumb; 3-5x range)  # absolute length TBD until stability gives total_length_mm
  shock_cord_min_rating_n: 1030  # ESTIMATE: 343 N opening load at 40 m/s (Cx 1.6) x proposed SF 3; owner to confirm SF; after knot derating
  ejection_protection: Estes recovery wadding (PROPOSED, $5.43-5.99)  # Nomex 6x6 alt
  deploy_velocity_m_s: TBD   # needs stability sim + motor delay
  recovery_mass_g: TBD       # chute + cord + wadding; weigh
  recovery_cg_from_nose_mm: TBD  # depends on bay position (stability/payload)
  bay_length_mm: TBD         # pack test of chosen chute; tube free volume 117.8 cm3 per 100 mm
